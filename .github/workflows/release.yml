concurrency:
  cancel-in-progress: false
  group: Release

jobs:
  release:
    if: "startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: regex-match
        uses: kaisugi/action-regex-match@v1.0.2
        with:
          flags: "su"
          regex: '^chore: release v(\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?)(?: \(#\d+\))?(?:\n|$)'
          text: ${{ github.event.head_commit.message }}

      - id: release_version
        if: steps.regex-match.outputs.match != ''
        run: echo "release_version=${{ steps.regex-match.outputs.group1 }}" >> "$GITHUB_OUTPUT"

      - if: steps.release_version.outputs.release_version != ''
        uses: ./.github/actions/prepare

      - if: steps.release_version.outputs.release_version != ''
        name: Build
        run: pnpm run build

      # 2.x only takes the latest dist-tag (and GitHub's Latest badge) while npm's latest is still 2.x
      - id: dist_tag
        if: steps.release_version.outputs.release_version != ''
        name: Choose npm dist-tag
        run: |
          if npm view ts-api-utils@latest version | grep -q '^2\.'; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--npm.tag=latest-v2 --github.makeLatest=false" >> "$GITHUB_OUTPUT"
          fi

      - env:
          GITHUB_TOKEN: ${{ github.token }}
        if: steps.release_version.outputs.release_version != ''
        name: Release
        run: pnpm dlx release-it --npm.allowSameVersion -i ${{ steps.release_version.outputs.release_version }} ${{ steps.dist_tag.outputs.args }}

name: Release

on:
  push:
    branches:
      - main
      - v2

permissions:
  contents: write
  id-token: write
  issues: write
  pages: write
  pull-requests: write
